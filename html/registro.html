<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="">
    <meta name="description" content="">
    <meta name="viewport" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria Web - Inicio de Sesion</title>
    <link rel = "stylesheet" href="../css/style.css">
    <link rel = "stylesheet" href="../css/formRegistro.css">
</head>
<body>

    <section id="registro">
        <div id="box">
            <h1>Crear Cuenta</h1>

            <form id="formulario">
                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej. Juan Pérez">
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" required placeholder="correo@ejemplo.com">
                </div>

                <div class="campo">
                    <label for="telefono">Número de teléfono</label>
                    <input type="tel" id="telefono" name="telefono" required placeholder="Ej. 5512345678">
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                
                <p> Ya tienes una cuenta?, <a href="../index.html">Inicia Sesion</a> aquí</p>

                <button type="submit" onclick="window.location.href='inicio.html'">Registrarse</button> 
            </form>
        </div>
    </section>

</body>
</html>
