<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria Web - Registro</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/formRegistro.css">
</head>
<body>

    <section id="registro">
        <div id="box">
            <h1>Crear Cuenta</h1>

            <form id="formulario">
                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej. Juan Pérez">
                </div>

                <div class="campo">
                    <label for="usuario">Nombre de usuario</label>
                    <input type="text" id="usuario" name="usuario" required placeholder="Ej. juanperez">
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" required placeholder="correo@ejemplo.com">
                </div>

                <div class="campo">
                    <label for="telefono">Número de teléfono</label>
                    <input type="tel" id="telefono" name="telefono" required placeholder="Ej. 5512345678">
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>

                <p>
                    ¿Ya tienes una cuenta?,
                    <a href="../index.html">Inicia sesión aquí</a>
                </p>

                <button type="submit">Registrarse</button>
            </form>
        </div>
    </section>

    <script src="../js/login.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const formRegistro = document.getElementById("formulario");
            if (formRegistro) {
                formRegistro.addEventListener("submit", crearUsuario);
            }
        });
    </script>
</body>
</html>
