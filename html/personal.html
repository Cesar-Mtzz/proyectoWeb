<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria Web - Personal</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/personal.css">
</head>
<body>
    <header>
        <nav>
            <a href="inicio.html"><img src="../icons/logo.svg" alt="Logo"></a>
            <input id="buscador" type="search" placeholder="Buscar...">
            <div>
                <a href="inicio.html">Inicio</a>
                <a href="ajustes.html">Ajustes</a>
                <a href="catalogo.html">Explorar</a>
                <a href="../index.html" id="btnCerrarSesion">Cerrar Sesión</a>
            </div>
        </nav>
    </header>

    <div id="contedorGeneral">
        <section id="menu-horizontal">
            <div>
                <a href="dashboard.html">Dashboard</a>
                <a href="personal.html">Gestionar<br>Personal</a>
            </div>
        </section>

        <section id="contenido">
            <section id="dashboard"></section>
        </section>
    </div>

    <nav id="botoneraEditar">
        <button id="btnAgregar" class="noVisible" type="button">
            <img src="../icons/mas.svg" alt="Agregar">
        </button>

        <button id="btnEditar" type="button">
            <img src="../icons/editar.svg" alt="Editar">
        </button>
    </nav>

    <div id="menuFlotante">
        <form id="formPersonal">
            <h2 id="tituloFormulario">Agregar personal</h2>

            <label for="inputNombre">Nombre completo</label>
            <input type="text" id="inputNombre" placeholder="Nombre del empleado" required maxlength="100">

            <label for="selectHorario">Horario</label>
            <select id="selectHorario" required>
                <option value="Matutino">Matutino (10:00 - 17:00)</option>
                <option value="Vespertino">Vespertino (17:00 - 21:00)</option>
            </select>

            <label for="selectPuesto">Puesto</label>
            <select id="selectPuesto" required>
                <option value="Gerente">Gerente</option>
                <option value="Gerente en capacitación">Gerente en capacitación</option>
                <option value="Staff">Staff</option>
                <option value="En capacitación">En capacitación</option>
            </select>

            <div class="botonesFormulario">
                <button type="button" id="btnCancelar">Cancelar</button>
                <button type="submit" id="btnGuardar">Guardar</button>
            </div>
        </form>
    </div>

    <script src="../js/login.js"></script>
    <script src="../js/roles.js"></script>
    <script src="../js/personal.js"></script>
    <script src="../js/catalogo.js"></script>
</body>
</html>
