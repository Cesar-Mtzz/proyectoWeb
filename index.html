<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria Web - Inicio de Sesión</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/formRegistro.css">
</head>
<body>

    <section id="inicio">
        <div id="box">
            <h1>Iniciar Sesión</h1>

            <form id="formulario">
                <div class="campo">
                    <label for="usuario">Nombre de usuario</label>
                    <input type="text" id="usuario" name="usuario" required placeholder="Ej. admin">
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>

                <p>
                    ¿No tienes una cuenta?,
                    <a href="html/registro.html">Regístrate aquí</a>
                </p>

                <p id="errorMsg" class="error-msg" hidden>
                    Usuario o contraseña incorrectos.
                </p>

                <button type="submit">Ingresar</button>
            </form>
        </div>
    </section>

    <script src="./js/login.js"></script>
    <script src="./js/roles.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            saltarLoginSiAutenticado();

            const formulario = document.getElementById("formulario");
            const errorMsg = document.getElementById("errorMsg");

            if (formulario) {
                formulario.addEventListener("submit", iniciarSesion);
                formulario.addEventListener("input", () => {
                    if (errorMsg) errorMsg.hidden = true;
                });
            }
        });
    </script>

</body>
</html>
